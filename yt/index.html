<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kanal Takip</title>
  <meta name="description" content="YouTube kanallarını anlık takip et, sıçramaları ve abone hedeflerini kaçırma.">
  <meta name="theme-color" content="#0f0f12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kanal Takip">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <div>
        <h1>Kanal Takip</h1>
        <p id="updated" class="muted">Yükleniyor…</p>
      </div>
    </div>
    <button id="refresh" class="icon-btn" aria-label="Yenile">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <nav id="tabs" class="tabs" aria-label="Kanallar"></nav>

  <main id="app"></main>

  <div id="celebrate" class="celebrate" hidden>
    <canvas id="confetti"></canvas>
    <div class="celebrate-card">
      <div class="celebrate-emoji">🎉</div>
      <h2 id="celebrate-title"></h2>
      <p id="celebrate-body"></p>
      <button id="celebrate-close" class="btn">Teşekkürler! 🥳</button>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
