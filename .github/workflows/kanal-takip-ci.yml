# Geçici derleme kontrolü: iOS projesinin Xcode'da derlendiğini ve sunucu testlerinin geçtiğini doğrular.
name: Kanal Takip derleme kontrolü

on:
  push:
    branches: [claude/awesome-heisenberg-kyy96n]
    paths: ['kanal-takip/**', '.github/workflows/kanal-takip-ci.yml']
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanal-takip/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/out

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Derle (simülatör, imzasız)
        working-directory: kanal-takip/ios
        run: |
          set -o pipefail
          xcodebuild -project KanalTakip.xcodeproj -scheme KanalTakip \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
