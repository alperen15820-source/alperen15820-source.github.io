# Geçici derleme kontrolü: iOS projesini derler, sunucu testlerini çalıştırır ve
# App Store ekran görüntülerini (6.9", TR + EN) dala kaydeder.
name: Kanal Takip derleme kontrolü

on:
  push:
    branches: [claude/awesome-heisenberg-kyy96n]
    paths: ['kanal-takip/**', '.github/workflows/kanal-takip-ci.yml']
  workflow_dispatch:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanal-takip/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir /tmp/out

  ios:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: kanal-takip/ios
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version

      - name: Simülatör seç (en büyük iPhone Pro Max)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone') and 'Pro Max' in x['name']))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      - name: Derle (imzasız)
        run: |
          set -o pipefail
          xcodebuild -project KanalTakip.xcodeproj -scheme KanalTakip -destination "id=$UDID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Cihaz için derle (iPhone + Watch, imzasız)
        run: |
          set -o pipefail
          xcodebuild -project KanalTakip.xcodeproj -scheme KanalTakip -destination 'generic/platform=iOS' \
            -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee device.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" device.log
          ls build-device/Build/Products/Debug-iphoneos/KanalTakip.app/Watch/

      - name: Saat ekran görüntüleri
        continue-on-error: true
        run: |
          WUDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'watchOS' in k for x in d[k] if 'Ultra' in x['name'] or 'Series' in x['name']))")
          xcrun simctl list devices | grep "$WUDID"
          xcodebuild -project KanalTakip.xcodeproj -scheme KanalTakipWatch -destination "id=$WUDID" -derivedDataPath build-watch CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD" || true
          APP=build-watch/Build/Products/Debug-watchsimulator/KanalTakipWatch.app
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$WUDID"; xcrun simctl bootstatus "$WUDID" -b
          xcrun simctl install "$WUDID" "$APP"
          mkdir -p shots/watch
          for lang in tr en; do
            xcrun simctl terminate "$WUDID" "$BID" 2>/dev/null || true
            xcrun simctl launch "$WUDID" "$BID" -demo -AppleLanguages "($lang)"
            sleep 8
            xcrun simctl io "$WUDID" screenshot "shots/watch/$lang.png"
          done

      - name: Ekran görüntüleri
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/KanalTakip.app
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$UDID" "$APP"
          shot() { dir=$1; name=$2; shift 2; mkdir -p "shots/$dir"; xcrun simctl terminate "$UDID" "$BID" 2>/dev/null || true; xcrun simctl launch "$UDID" "$BID" "$@"; sleep 6; xcrun simctl io "$UDID" screenshot "shots/$dir/$name.png"; }
          for lang in tr en; do
            loc=$([ $lang = tr ] && echo tr_TR || echo en_US)
            L="-AppleLanguages ($lang) -AppleLocale $loc"
            shot $lang 1-kanallar -demo $L
            shot $lang 2-detay -demo -open otomasyon $L
            shot $lang 3-kutlama -demo -celebrate $L
            shot $lang 4-olaylar -demo -tab 1 $L
            shot $lang 5-ayarlar -demo -tab 2 $L
            shot $lang 6-karsilama -demo -onboarding $L
          done
          find shots -name '*.png' | sort

      - name: Ekran görüntülerini kaydet
        run: |
          rm -rf screenshots && mkdir -p screenshots/appstore screenshots/preview
          cp -R shots/* screenshots/appstore/
          for f in shots/*/*.png; do d=screenshots/preview/$(basename $(dirname "$f")); mkdir -p "$d"; sips -Z 900 "$f" --out "$d/$(basename "$f")" >/dev/null; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots
          git diff --cached --quiet || { git commit -qm "Kanal Takip: App Store ekran görüntüleri [skip ci]"; git push -q origin HEAD:${{ github.ref_name }}; }
